<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clips vidéo | Merve Borza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/projet-clip-video.css">
</head>
<body>
  <a href="index.html" class="top-name"><span class="top-name-glow"></span>MERVE BORZA</a>

  <a href="projets.html" class="back-link">← Retour aux projets</a>

  <div class="stage">
    <p class="eyebrow">CLIPS VIDÉO</p>
    <h1>Clip vidéos</h1>

    <div class="stack" id="stack">
      <div class="card active" data-video="SQ0NNKyj4Bw" data-index="0">
        <span class="card-label">Clip vidéo 1</span>
      </div>
      <div class="card right" data-video="" data-index="1">
        <span class="card-label">À venir</span>
      </div>
    </div>

    <div class="player-bar">
      <button id="prev"><svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
      <button class="play" id="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <div class="track-info">
        <strong id="track-title">Clip vidéo 1</strong>
        <span>MERVE BORZA — RÉALISATION</span>
      </div>
      <button id="next"><svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
    </div>

    <p class="stage-note">Clique sur la carte centrale (ou sur le bouton lecture) pour lire le clip. Les flèches font tourner le carrousel.</p>
  </div>

  <div class="tv-viewer" id="video-viewer">
    <div class="tv-viewer-frame" id="video-viewer-frame"></div>
    <span class="tv-viewer-close" id="video-viewer-close">← Fermer</span>
  </div>

  <script src="js/projet-clip-video.js" defer></script>
</body>
</html>
