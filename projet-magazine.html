<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazine shooting | Merve Borza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --text:#f4f2f5; --text-dim:rgba(244,242,245,0.62); --text-faint:rgba(244,242,245,0.38);
    --violet:#7f5af0; --violet-soft:#a695f2; --hairline:rgba(255,255,255,0.1);
    --font-display:'Bodoni Moda', serif; --font-body:'Jost', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased;}

  .back-link{
    position:fixed; top:24px; left:24px; z-index:10;
    display:flex; align-items:center; gap:8px;
    color:var(--text-dim); font-size:13px; letter-spacing:1px; text-decoration:none;
  }
  .back-link:hover{color:var(--text);}

  .stage{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:10vh 20px 6vh; text-align:center;
  }
  .eyebrow{color:var(--violet-soft); font-size:11px; letter-spacing:3px; margin-bottom:8px;}
  .stage h1{font-family:var(--font-display); font-weight:400; font-size:26px; margin-bottom:4vh;}

  .placeholder-box{
    width:min(400px, 80vw); aspect-ratio:4/3;
    border-radius:10px;
    background:linear-gradient(160deg, #1c1620, #100c14);
    border:0.5px solid rgba(127,90,240,0.25);
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
  }
  .placeholder-box svg{width:40px; height:40px; stroke:var(--violet-soft); fill:none; stroke-width:1.4; opacity:0.6;}

  .stage-note{
    margin-top:5vh; color:var(--text-faint); font-size:11px; letter-spacing:0.5px; max-width:360px;
  }
</style>
</head>
<body>

  <a href="/" class="back-link">← Retour aux projets</a>

  <div class="stage">
    <p class="eyebrow">MAGAZINE SHOOTING</p>
    <h1>Projet bientôt disponible</h1>

    <div class="placeholder-box">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>

    <p class="stage-note">Ce shooting est en cours de préparation. Reviens bientôt pour le découvrir.</p>
  </div>

</body>
</html>
