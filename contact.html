<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Merve Borza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --bg-panel:#121012;
    --text:#f4f2f5; --text-dim:rgba(244,242,245,0.62); --text-faint:rgba(244,242,245,0.38);
    --violet:#7f5af0; --violet-soft:#a695f2; --hairline:rgba(255,255,255,0.1);
    --font-display:'Bodoni Moda', serif; --font-body:'Jost', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}

  .wrap{max-width:560px; margin:0 auto; padding:14vh 6vw 10vh;}
  .eyebrow{color:var(--violet-soft); font-size:12px; letter-spacing:4px; margin-bottom:16px; text-align:center; font-weight:500;}
  h1{font-family:var(--font-display); font-weight:400; font-size:clamp(32px,6vw,48px); text-align:center; margin-bottom:14px;}
  .intro{color:var(--text-dim); text-align:center; font-size:15px; line-height:1.7; margin-bottom:6vh;}

  form{display:flex; flex-direction:column; gap:22px;}
  .field label{display:block; font-size:11px; letter-spacing:1.5px; color:var(--text-faint); margin-bottom:8px;}
  .field input, .field textarea{
    width:100%; background:transparent; border:none; border-bottom:0.5px solid var(--hairline);
    color:var(--text); font-family:var(--font-body); font-size:15px; padding:8px 2px;
    transition:border-color .25s;
  }
  .field textarea{resize:vertical; min-height:110px;}
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--violet);}

  .submit-btn{
    margin-top:12px; align-self:center;
    padding:14px 40px; border-radius:4px; border:0.5px solid var(--violet);
    background:transparent; color:var(--text); font-family:var(--font-body);
    font-size:13px; letter-spacing:1.5px; cursor:pointer;
    transition:background .2s, transform .2s;
  }
  .submit-btn:hover{background:rgba(127,90,240,0.14); transform:translateY(-2px);}

  .alt-contact{
    margin-top:8vh; text-align:center; border-top:0.5px solid var(--hairline); padding-top:5vh;
  }
  .alt-contact p{color:var(--text-faint); font-size:11px; letter-spacing:2px; margin-bottom:14px;}
  .alt-links{display:flex; justify-content:center; gap:24px;}
  .alt-links a{color:var(--text-dim); font-size:14px; text-decoration:none; transition:color .2s;}
  .alt-links a:hover{color:var(--violet-soft);}
</style>
</head>
<body>

  <div class="wrap">
    <p class="eyebrow">CONTACT</p>
    <h1>Parlons de votre projet</h1>
    <p class="intro">Un mariage, un projet de marque, un clip — écrivez-moi ce que vous avez en tête, je réponds sous 48h.</p>

    <form id="contact-form">
      <div class="field">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="submit-btn">Envoyer</button>
    </form>

    <div class="alt-contact">
      <p>OU DIRECTEMENT</p>
      <div class="alt-links">
        <a href="mailto:contact@merveborza.com">contact@merveborza.com</a>
        <a href="#">Instagram</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>
  </div>

  <script>
    // Ouvre le client mail de l'utilisateur avec le message pré-rempli.
    // Ton ami codeur peut remplacer ceci par un vrai service d'envoi
    // (ex: Formspree, Framer's native form action) pour un envoi silencieux sans ouvrir le client mail.
    document.getElementById('contact-form').addEventListener('submit', function(e){
      e.preventDefault();
      var name = document.getElementById('name').value;
      var email = document.getElementById('email').value;
      var message = document.getElementById('message').value;
      var subject = encodeURIComponent('Nouveau message depuis le portfolio — ' + name);
      var body = encodeURIComponent(message + '\n\n---\n' + name + '\n' + email);
      window.location.href = 'mailto:contact@merveborza.com?subject=' + subject + '&body=' + body;
    });
  </script>

</body>
</html>
