<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Merve Borza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/contact.css">
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-name"><span class="nav-name-glow"></span>MERVE BORZA</a>
    <div class="nav-links">
      <a href="projets.html">Projets</a>
      <a href="apropos.html">À propos</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="wrap">
    <p class="eyebrow">CONTACT</p>
    <h1>Parlons de votre projet</h1>
    <p class="intro">Un mariage, un projet de marque, un clip — écrivez-moi ce que vous avez en tête, je réponds sous 48h.</p>

    <form id="contact-form">
      <div class="field">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="submit-btn">Envoyer</button>
    </form>

    <div class="alt-contact">
      <p>OU DIRECTEMENT</p>
      <div class="alt-links">
        <a href="mailto:merveborza@gmail.com">merveborza@gmail.com</a>
        <a href="https://www.instagram.com/merveborza/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.linkedin.com/in/merve-borza-72571a181/" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </div>

  <script src="js/contact.js" defer></script>
</body>
</html>
